[package]
name = "tds-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "A literate TDS client: explicit protocol definitions and connection procedures"

[features]
default = ["tokio"]
tokio = ["dep:tokio", "dep:hostname"]

[dependencies]
hostname = { version = "0.4", optional = true }
base64 = "0.22"
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-pemfile = "2"
tokio = { version = "1", optional = true, features = ["rt", "net", "io-util", "fs", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[[bin]]
name = "tds"
path = "src/bin/tds/main.rs"
required-features = ["tokio"]

[[test]]
name = "live_connection"
required-features = ["tokio"]
