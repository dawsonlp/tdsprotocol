[package]
name = "tds-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false
repository = "https://github.com/dawsonlp/tdsprotocol"
description = "A literate TDS client: explicit protocol definitions and connection procedures"

[workspace]
members = ["native-sspi", "native-certstore", "native-gssapi"]
resolver = "3"

[features]
default = ["tokio"]
tokio = ["dep:tokio", "dep:hostname"]
encryption = ["tokio", "dep:aws-lc-rs"]
integrated-auth = ["tokio", "dep:sspi", "dep:sha2", "dep:x509-parser", "dep:tds-native-sspi"]
system-gssapi = ["integrated-auth", "dep:tds-native-gssapi"]
azure-identity = ["tokio", "dep:azure_core", "dep:azure_identity", "dep:async-trait"]
azure-keyvault = ["encryption", "azure-identity", "dep:azure_security_keyvault_keys"]
certificate-store = ["encryption", "dep:x509-parser", "dep:tds-native-certstore"]

[dependencies]
tds-native-gssapi = { version = "=0.1.0", path = "native-gssapi", optional = true }
tds-native-certstore = { version = "=0.1.0", path = "native-certstore", optional = true }
azure_security_keyvault_keys = { version = "=1.0.1", default-features = false, optional = true }
azure_core = { version = "=1.0.0", default-features = false, features = ["reqwest_rustls", "tokio"], optional = true }
azure_identity = { version = "=1.0.0", default-features = false, features = ["tokio"], optional = true }
async-trait = { version = "0.1", optional = true }
hostname = { version = "0.4", optional = true }
aws-lc-rs = { version = "=1.18.2", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"], optional = true }
zeroize = "=1.9.1"
sspi = { version = "=0.23.0", default-features = false, optional = true }
sha2 = { version = "0.10", optional = true }
x509-parser = { version = "0.18", optional = true }
base64 = "0.22"
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-pemfile = "2"
tokio = { version = "1", optional = true, features = ["rt", "net", "io-util", "fs", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[target.'cfg(windows)'.dependencies]
tds-native-sspi = { version = "=0.1.0", path = "native-sspi", optional = true }

[[bin]]
name = "tds"
path = "src/bin/tds/main.rs"
required-features = ["tokio"]

[[test]]
name = "live_connection"
required-features = ["tokio"]

[[example]]
name = "key_policy_cost"
required-features = ["encryption"]

[[example]]
name = "always_encrypted"
required-features = ["encryption"]

[[example]]
name = "login_probe"
required-features = ["integrated-auth"]

[[example]]
name = "azure_encrypted"
required-features = ["azure-keyvault"]
