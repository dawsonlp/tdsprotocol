# SQL Server's settings for the test container (D-10), mounted at /var/opt/mssql/mssql.conf.
# The certificate is made by make-test-certificates.sh, and mounted in /etc/mssql-tls: /etc/ssl/private in the image
# is closed to the mssql user, which SQL Server runs as (error 49940). forceencryption 0: the client asks for encryption (TDS 7.4)
# or starts with TLS (TDS 8.0); the server doesn't force it on clients that don't.
[network]
tlscert = /etc/mssql-tls/server.pem
tlskey = /etc/mssql-tls/server.key
forceencryption = 0
